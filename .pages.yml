# Pages CMS 設定（本番）
# 作品は Jekyll コレクション _works/ に 1作品＝1Markdownファイルで管理する。
# 新規作品のファイル名は slug 項目から自動生成される（filename: "{fields.slug}.md"）。
media:
  - name: images
    label: 画像（原画アップロード先）
    input: assets/originals
    output: /assets/originals
    extensions: [jpg, jpeg, png, webp, gif, svg]
    categories: [image]

content:
  - name: works
    label: 作品
    type: collection
    path: _works
    format: yaml-frontmatter
    extension: md
    filename: "{fields.slug}.md"
    view:
      fields: [image, title, category, published]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: slug
        label: URL用の英数字ID（例：summer-sky-2026／詳細ページのURLになります・半角英数字とハイフンのみ）
        type: string
        required: true
      - name: image
        label: 作品画像
        description: 原画のままアップロードでOK・公開用に自動で最適化されます
        type: image
        options:
          media: images
      - name: category
        label: カテゴリー
        type: select
        options:
          values: [FAN ART, COMMISSION, WORKS, ORIGINAL]
      - name: year
        label: 制作年
        type: number
      - name: description
        label: 説明（モーダルに表示されます）
        type: text
      - name: order
        label: 表示順（小さい順に並びます）
        type: number
      - name: published
        label: 公開する
        type: boolean
        default: true
      - name: featured
        label: メインビジュアルに設定する
        type: boolean
        default: false
      - name: hasDetail
        label: 詳細ページを作る
        type: boolean
        default: false
      - name: detailDescription
        label: 詳細ページ用の説明（詳細ページを作る場合のみ）
        type: text
      - name: role
        label: 制作担当範囲（詳細ページ用）
        type: string
      - name: medium
        label: 使用媒体・掲載先（詳細ページ用）
        type: string
      - name: client
        label: クライアント情報（公開許可がある場合のみ・詳細ページ用）
        type: string
      - name: relatedLink
        label: 関連リンク（詳細ページ用）
        type: string
